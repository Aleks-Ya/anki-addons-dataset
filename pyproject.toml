[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-addons-dataset"
dynamic = ["version"]
description = "Collects, processes, and publishes structured data about Anki flashcard addons to HuggingFace."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksey Yablokov", email = "alex_ya@mailbox.org" }]
keywords = ["anki", "addons", "dataset", "ankiweb", "huggingface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "mdutils",
    "pyyaml",
    "XlsxWriter",
    "selenium",
    "huggingface-hub",
    "pandas",
    "pyarrow",
    "seedir",
    "openpyxl",
    "pydiscourse",
    "humanize",
    "lingua-language-detector",
    "openai",
    "magika",
]

[project.urls]
Homepage = "https://github.com/Aleks-Ya/anki-addons-dataset"
Repository = "https://github.com/Aleks-Ya/anki-addons-dataset"
Dataset = "https://huggingface.co/datasets/Ya-Alex/anki-addons"
Visualizations = "https://huggingface.co/spaces/Ya-Alex/anki-addons"

[project.scripts]
anki-addons-dataset = "anki_addons_dataset.addon_catalog:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yaml", "*.json", "*.md"]

[tool.setuptools.dynamic]
version = { attr = "anki_addons_dataset.__version__" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "freezegun",
    "bump-my-version",
    "mypy",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = ["xlsxwriter.*", "pyarrow.*", "pydiscourse.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "anki_addons_dataset.collector.ankiforum.ankiforum_service",
    "anki_addons_dataset.collector.ankiforum.ankiforum_topic_discoverer",
    "anki_addons_dataset.collector.anki_versions_collector",
    "anki_addons_dataset.collector.ankiweb.addon_page_parser",
    "anki_addons_dataset.collector.ankiweb.addons_page_parser",
    "anki_addons_dataset.collector.author_resolver",
    "anki_addons_dataset.collector.collector_facade",
    "anki_addons_dataset.collector.github.github_rate_limit",
    "anki_addons_dataset.collector.github.github_repo_selector",
    "anki_addons_dataset.collector.github.handler.actions_repo_handler",
    "anki_addons_dataset.collector.github.handler.contents_repo_handler",
    "anki_addons_dataset.collector.github.handler.issue_history_repo_handler",
    "anki_addons_dataset.collector.github.handler.languages_repo_handler",
    "anki_addons_dataset.collector.github.handler.last_commit_repo_handler",
    "anki_addons_dataset.collector.github.handler.readme_repo_handler",
    "anki_addons_dataset.collector.github.handler.repo_info_repo_handler",
    "anki_addons_dataset.collector.github.handler.stars_repo_handler",
    "anki_addons_dataset.collector.github.handler.tests_repo_handler",
    "anki_addons_dataset.collector.github.handler.tree_entries_repo_handler",
    "anki_addons_dataset.collector.package.package_collector",
    "anki_addons_dataset.collector.url_parser",
    "anki_addons_dataset.common.json_helper",
    "anki_addons_dataset.common.log",
    "anki_addons_dataset.exporter.json_addon_info",
    "Found 35 errors in 24 files (checked 103 source files)",
]
ignore_errors = true
