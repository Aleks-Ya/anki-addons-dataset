name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6 # https://github.com/actions/checkout/tags
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7 # https://github.com/astral-sh/setup-uv/tags
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # https://github.com/pypa/gh-action-pypi-publish/tags
