name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6 # https://github.com/actions/checkout/tags
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6 # https://github.com/actions/setup-python/tags
        with:
          python-version: "3.14"
      - name: Build distributions
        run: |
          pip install --root-user-action=ignore -U build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # https://github.com/pypa/gh-action-pypi-publish/tags
