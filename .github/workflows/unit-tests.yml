name: Unit-tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # https://github.com/actions/checkout/tags
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main # https://github.com/trufflesecurity/trufflehog/tags
        with:
          extra_args: --results=verified,unknown --debug
      - name: Install uv
        uses: astral-sh/setup-uv@v7 # https://github.com/astral-sh/setup-uv/tags
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: PyTest
        run: uv run pytest -v --cov=anki_addons_dataset --cov-report=xml --cov-branch
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8 # https://github.com/SonarSource/sonarqube-scan-action/tags
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
